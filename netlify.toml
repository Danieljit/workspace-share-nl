[build]
  command = "node scripts/setup-env.js && npm ci && npx prisma generate && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NEXT_USE_NETLIFY_EDGE = "true"
  NODE_VERSION = "18"
  NEXT_TELEMETRY_DISABLED = "1"
  # Empty credentials to prevent URL errors during build
  GOOGLE_CLIENT_ID = ""
  GOOGLE_CLIENT_SECRET = ""
  # Disable secrets scanning
  SECRETS_SCAN_ENABLED = "false"

# Prevent asset optimization which can break Next.js assets
[build.processing]
  skip_processing = true

# Security response headers (applied to all routes).
# NOTE: a full Content-Security-Policy is intentionally omitted here — it needs
# per-source testing (Stripe, Leaflet/OpenStreetMap tiles, Cloudinary, Google
# Fonts) before enabling, or it will break those integrations. Add it as a
# dedicated follow-up.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Handle client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
